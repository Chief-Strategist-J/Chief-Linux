target_total_requests: 1000000
target_window_seconds: 600
headroom_factor: 1.3
kafka:
  topic_partitions: 48
  replication_factor: 3
  min_insync_replicas: 2
  producer:
    acks: all
    batch_size: 131072
    linger_ms: 5
    compression_type: lz4
  consumer:
    group_size: 24
    max_poll_records: 1000
    fetch_min_bytes: 1024
    fetch_max_wait_ms: 250
  reliability:
    retries: 10
    retry_backoff_ms: 100
    request_timeout_ms: 30000
